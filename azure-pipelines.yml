trigger:
- main

variables:
  IMAGE_NAME: myapp
  IMAGE_TAG: "1.0"

pool:
  name: Default   # or your self-hosted agent pool (EC2)

stages:
- stage: BuildAndPush
  displayName: Build and Push Docker Image
  jobs:
  - job: DockerBuildPush
    displayName: Build & Push Image
    steps:

    # Print environment info
    - script: |
        echo "Linux user: $(whoami)"
        echo "Docker image name: $(IMAGE_NAME)"
        echo "Docker image tag: $(IMAGE_TAG)"
      displayName: "Print build info"

    # Build & Push using Docker service connection
    # Multi-stage Dockerfile handles Maven build internally (eclipse-temurin:17-jdk-jammy)
    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: dockerhub-con
        repository: $(IMAGE_NAME)
        command: buildAndPush
        Dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(IMAGE_TAG)
