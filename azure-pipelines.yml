trigger:
- main

variables:
  image_repository: docker.io/anil2469/nodeapp
  image_tag: v1.0
  MICRO_SERVICE_NAME: nodeapp
  DEPLOYMENT_ENVIRONMENT: dev

pool:
  name: Default

stages:
# ---------------- TEST STAGE ----------------
- stage: Test
  displayName: Test stage
  jobs:
  - job: UnitTests
    displayName: Run unit tests
    steps:
    - script: echo "Preparing test data..."
      displayName: Prepare test data

    - script: |
        echo "Running unit tests for micro service $(MICRO_SERVICE_NAME) ..."
      displayName: Run unit tests

    - script: echo "Cleaning up temporary files..."
      displayName: Cleanup

# ---------------- BUILD STAGE ----------------
- stage: Build
  displayName: Build stage
  dependsOn: Test
  jobs:
  - job: BuildAndPush
    displayName: Build and push image
    steps:
    - script: echo "Building the docker image..."
      displayName: Build image

    - script: |
        echo "Tagging the docker image $(image_repository):$(image_tag) ..."
      displayName: Tag image

    - script: echo "Logging into docker registry..."
      displayName: Docker login

    - script: |
        echo "Pushing docker image $(image_repository):$(image_tag) to registry..."
      displayName: Push image

# ---------------- DEPLOY STAGE ----------------
- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy image
    steps:
    - script: |
        echo "Deploying docker image $(image_repository):$(image_tag) to $(DEPLOYMENT_ENVIRONMENT) server..."
      displayName: Deploy
