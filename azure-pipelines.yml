trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------------- TEST STAGE ----------------
- stage: Test
  displayName: Test stage
  jobs:
  - job: Tests
    displayName: Run unit & lint tests
    steps:
    - script: echo "Preparing test data..."
      displayName: Prepare test data

    - script: echo "Running unit tests..."
      displayName: Run unit tests

    - script: echo "Running lint tests..."
      displayName: Run lint tests

    - script: echo "Cleaning up temporary files..."
      displayName: Cleanup

# ---------------- BUILD STAGE ----------------
- stage: Build
  displayName: Build stage
  dependsOn: Test
  jobs:
  - job: BuildAndPush
    displayName: Build and push docker image
    steps:
    - script: wrong-command "Building the docker image..."
      displayName: Build docker image (intentional failure)

    - script: echo "Tagging the docker image..."
      displayName: Tag docker image

    - script: echo "Logging into docker registry..."
      displayName: Docker login

    - script: echo "Pushing docker image to registry..."
      displayName: Push docker image

# ---------------- DEPLOY STAGE ----------------
- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy docker image
    steps:
    - script: echo "Deploying docker image to dev server..."
      displayName: Deploy
